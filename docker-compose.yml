services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_PORT: 3001
      HOST: 0.0.0.0
      API_KEY: ${API_KEY:-}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-500}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-4}
      STORAGE_PATH: /app/storage
      TEMP_PATH: /app/storage/temp
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      MAX_PAYLOAD: ${MAX_PAYLOAD:-12mb}
      JOB_TTL_MINUTES: ${JOB_TTL_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - qr-storage:/app/storage
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - qr-studio

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:80'
    networks:
      - qr-studio

volumes:
  qr-storage:

networks:
  qr-studio:
    driver: bridge
